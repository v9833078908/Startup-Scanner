# Hard rejects (no LLM needed — always excluded)
exclude_niches:
  - real estate development
  - oil
  - gas
  - petrochemical
  - mining
  - agriculture
  - farming
  - construction
  - senior living
  - nursing home
  - assisted living
  - traditional retail
  - food & beverage
  - restaurant

# Round size hard reject (not startup territory)
max_round_usd: 500000000

# Anti-spam
min_description_length: 20

# Date range (null = no filter)
date_from: null
date_to: null

# NOTE: include_niches REMOVED — replaced by LLM classification in prefilter
# NOTE: invest_round_min/max REMOVED — round is a scoring factor, not an eligibility gate
